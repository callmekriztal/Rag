<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Assistant</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:grid;
  place-items:center;
  font-family:Inter,system-ui,sans-serif;
  background:#0A0A0A;
  color:#EAEAEA;
}

#app{
  width:min(850px,95vw);
  height:min(900px,92vh);
  background:#111111;
  border-radius:24px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:1px solid #2A2A2A;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

#header{
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  background:#151515;
  border-bottom:1px solid #2A2A2A;
  color:#EAEAEA;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:14px;
  background:#111111;
}

#messages::-webkit-scrollbar{
  width:6px;
}

#messages::-webkit-scrollbar-thumb{
  background:#333333;
  border-radius:999px;
}

.message{
  max-width:80%;
  padding:12px 16px;
  border-radius:18px;
  line-height:1.7;
  white-space:pre-wrap;
  font-size:15px;
}

.user{
  align-self:flex-end;
  background:#2563EB;
  color:white;
  border-bottom-right-radius:6px;
}

.bot{
  align-self:flex-start;
  background:#1A1A1A;
  color:#EAEAEA;
  border:1px solid #2A2A2A;
  border-bottom-left-radius:6px;
}

.sources-container{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid #333333;
  font-size:12px;
  color:#9CA3AF;
}

.sources-title{
  font-weight:600;
  margin-bottom:4px;
  color:#D1D5DB;
}

.source-badge{
  display:inline-block;
  background:#262626;
  color:#60A5FA;
  padding:2px 8px;
  border-radius:6px;
  margin-right:6px;
  margin-top:4px;
  border:1px solid #374151;
}

.typing{
  color:#9CA3AF;
  font-size:14px;
}

#upload-area{
  padding:0 24px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  background:#111111;
}

#file-input{
  display:none;
}

#upload-label{
  cursor:pointer;
  background:#222222;
  color:#EAEAEA;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid #333333;
  font-weight:600;
}

#upload-label:hover{
  background:#2A2A2A;
}

#upload-status{
  color:#9CA3AF;
}

#input-area{
  padding:18px;
  display:flex;
  gap:10px;
  background:#151515;
  border-top:1px solid #2A2A2A;
}

#input{
  flex:1;
  border:1px solid #2A2A2A;
  outline:none;
  resize:none;
  background:#1E1E1E;
  color:#EAEAEA;
  padding:14px 18px;
  border-radius:999px;
  font:inherit;
}

#input::placeholder{
  color:#6B7280;
}

#input:focus{
  border-color:#2563EB;
}

#send{
  border:none;
  background:#2563EB;
  color:white;
  padding:0 22px;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
}

#send:hover{
  filter:brightness(1.1);
}

#send:disabled{
  opacity:.5;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div id="app">

  <div id="header">
    Document Assistant
  </div>

  <div id="messages">
    <div class="message bot">
      Upload a document and ask questions about its contents.
    </div>
  </div>

  <div id="upload-area">
    <input type="file" id="file-input" accept=".pdf,.txt,.docx,.csv,.json,.xlsx">
    <label for="file-input" id="upload-label">
      Upload document
    </label>
    <span id="upload-status"></span>
  </div>

  <div id="input-area">
    <textarea
      id="input"
      rows="1"
      placeholder="Ask a question..."
    ></textarea>

    <button id="send">
      Send
    </button>
  </div>

</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const fileInput = document.getElementById("file-input");
const uploadStatus = document.getElementById("upload-status");

function addMessage(text, role, sources = []){
  const div = document.createElement("div");
  div.className = `message ${role}`;
  
  const textNode = document.createElement("div");
  textNode.textContent = text;
  div.appendChild(textNode);

  if(sources && sources.length > 0){
    const srcContainer = document.createElement("div");
    srcContainer.className = "sources-container";
    
    const srcTitle = document.createElement("div");
    srcTitle.className = "sources-title";
    srcTitle.textContent = "Sources:";
    srcContainer.appendChild(srcTitle);

    sources.forEach(src => {
      const badge = document.createElement("span");
      badge.className = "source-badge";
      badge.textContent = src.label || src.file;
      srcContainer.appendChild(badge);
    });

    div.appendChild(srcContainer);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping(){
  const div = document.createElement("div");
  div.className = "typing";
  div.textContent = "Thinking...";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage(){
  const question = inputEl.value.trim();

  if(!question) return;

  addMessage(question,"user");

  inputEl.value = "";
  sendBtn.disabled = true;

  const typing = addTyping();

  try{
    const res = await fetch("/query",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question,
        top_k:3
      })
    });

    const data = await res.json();

    typing.remove();

    addMessage(
      data.answer || "No response received.",
      "bot",
      data.sources || []
    );

  }catch(err){

    typing.remove();

    addMessage(
      "Something went wrong. Try again.",
      "bot"
    );

  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click",sendMessage);

inputEl.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

fileInput.addEventListener("change",async()=>{

  const file = fileInput.files[0];

  if(!file) return;

  uploadStatus.textContent = "Uploading...";

  const formData = new FormData();
  formData.append("file",file);

  try{

    const res = await fetch("/upload",{
      method:"POST",
      body:formData
    });

    const data = await res.json();

    uploadStatus.textContent =
      data.message || "Upload complete";

  }catch(err){

    uploadStatus.textContent =
      "Upload failed";

  }
});
</script>

</body>
</html>
