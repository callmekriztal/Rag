<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }

    #header {
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #header span {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #2f6feb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: #252525;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .typing {
      align-self: flex-start;
      background: #252525;
      color: #666;
      padding: 12px 16px;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      font-size: 14px;
    }

    #input-area {
      padding: 16px 24px;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 12px;
    }

    #input {
      flex: 1;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    #input:focus { border-color: #2f6feb; }

    #send {
      background: #2f6feb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    #send:hover { background: #1a5fd4; }
    #send:disabled { background: #333; cursor: not-allowed; }

    #upload-area {
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #666;
    }

    #file-input { display: none; }

    #upload-label {
      cursor: pointer;
      color: #2f6feb;
      text-decoration: underline;
    }

    #upload-status { font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <span></span>
      RAG Chatbot
    </div>

    <div id="messages">
      <div class="message bot">Hi! Ask me anything about the documents I've been trained on.</div>
    </div>

    <div id="upload-area">
      <input type="file" id="file-input" accept=".pdf,.txt,.docx,.csv,.json" />
      <label for="file-input" id="upload-label">Upload document</label>
      <span id="upload-status"></span>
    </div>

    <div id="input-area">
      <textarea id="input" rows="1" placeholder="Ask a question..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const fileInput = document.getElementById("file-input");
    const uploadStatus = document.getElementById("upload-status");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.textContent = "Thinking...";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      addMessage(question, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      const typing = addTyping();

      try {
        const res = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, top_k: 3 }),
        });
        const data = await res.json();
        typing.remove();
        addMessage(data.answer, "bot");
      } catch (err) {
        typing.remove();
        addMessage("Something went wrong. Try again.", "bot");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", sendMessage);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadStatus.textContent = "Uploading...";
      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/upload", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        uploadStatus.textContent = data.message || "Done";
      } catch (err) {
        uploadStatus.textContent = "Upload failed";
      }
    });
  </script>
</body>
</html>
